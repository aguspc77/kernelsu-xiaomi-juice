name: Kernel Builder Redmi 9T juice based on AOSPA

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Fix git safe directory
      run: git config --global --add safe.directory /github/workspace/source

    - name: Checkout kernel source
      uses: actions/checkout@v2
      with:
        repository: ShelbyHell/sunrise_kernel_juice
        ref: topaz
        path: source
    - name: Checkout zipper
      uses: actions/checkout@v2
      with:
        repository: lemniskett/AnyKernel3
        path: zipper
    - name: Integrate SukiSU-Ultra
      run: |
        cd source

        echo "[+] Append kernel params"
        echo "CONFIG_KPROBES=y" >> arch/arm64/configs/vendor/bengal-perf_defconfig
        echo "CONFIG_HAVE_KPROBES=y" >> arch/arm64/configs/vendor/bengal-perf_defconfig
        echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/vendor/bengal-perf_defconfig
        echo "CONFIG_KALLSYMS=y" >> arch/arm64/configs/vendor/bengal-perf_defconfig
        echo "CONFIG_KALLSYMS_ALL=y" >> arch/arm64/configs/vendor/bengal-perf_defconfig
        echo "CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y" >> arch/arm64/configs/vendor/bengal-perf_defconfig

        echo "[+] Integrating SukiSU-Ultra (susfs-dev branch)"
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-dev

        echo "[+] Fixing 4.19 compat"
        KSU_PATH=$(readlink -f drivers/kernelsu)

        # Hapus MODULE_IMPORT_NS (tidak ada di 4.19)
        find "$KSU_PATH" -name "*.c" | xargs sed -i '/MODULE_IMPORT_NS/d' 2>/dev/null || true

        # linux/pgtable.h -> asm/pgtable.h (tidak ada di 4.19)
        find "$KSU_PATH" -name "*.c" -o -name "*.h" | xargs sed -i 's|#include <linux/pgtable.h>|#include <asm/pgtable.h>|' 2>/dev/null || true

        # strncpy_from_user_nofault -> strncpy_from_user (4.19)
        find "$KSU_PATH" -name "*.c" | xargs sed -i 's|strncpy_from_user_nofault|strncpy_from_user|g' 2>/dev/null || true

        # copy_to/from_kernel_nofault -> copy_to/from_kernel (4.19)
        find "$KSU_PATH" -name "*.c" | xargs sed -i 's|copy_to_kernel_nofault|copy_to_kernel|g' 2>/dev/null || true
        find "$KSU_PATH" -name "*.c" | xargs sed -i 's|copy_from_kernel_nofault|copy_from_kernel|g' 2>/dev/null || true

        # Tambahin include linux/uaccess.h di patch_memory.c
        find "$KSU_PATH" -name "patch_memory.c" | xargs sed -i '1i #include <linux/uaccess.h>' 2>/dev/null || true

        # access_ok 2-arg -> 3-arg
        find "$KSU_PATH" -name "*.c" | xargs sed -i 's|access_ok(\([^,]*\), \([^)]*\))|access_ok(\1, \2, VERIFY_READ)|g' 2>/dev/null || true

        # prio_sys_enter -> sys_enter + hapus INT_MIN (4.19)
        find "$KSU_PATH" -name "*.c" | xargs sed -i 's|register_trace_prio_sys_enter|register_trace_sys_enter|g' 2>/dev/null || true
        find "$KSU_PATH" -name "*.c" | xargs sed -i 's|unregister_trace_prio_sys_enter|unregister_trace_sys_enter|g' 2>/dev/null || true
        find "$KSU_PATH" -name "*.c" | xargs sed -i '/register_trace_sys_enter/s|, INT_MIN||g' 2>/dev/null || true
        find "$KSU_PATH" -name "*.c" | xargs sed -i '/unregister_trace_sys_enter/s|, INT_MIN||g' 2>/dev/null || true

        echo "[+] Done."
    - name: Android kernel build
      uses: lemniskett/android-kernel-actions@master
      id: build
      env:
        KERNEL_PATH: source
      with:
        arch: arm64
        compiler: proton-clang/master/binutils
        defconfig: vendor/bengal-perf_defconfig
        image: Image
    - name: Upload Build
      uses: actions/upload-artifact@v4
      with:
        name: Image
        path: /home/runner/work/kernelsu-xiaomi-juice/kernelsu-xiaomi-juice/zipper   
