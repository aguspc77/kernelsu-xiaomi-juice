name: Kernel Builder Redmi 9T juice based on AOSPA

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Fix git safe directory
      run: git config --global --add safe.directory /github/workspace/source

    - name: Checkout kernel source
      uses: actions/checkout@v2
      with:
        repository: ShelbyHell/sunrise_kernel_juice
        ref: topaz
        path: source
    - name: Checkout zipper
      uses: actions/checkout@v2
      with:
        repository: lemniskett/AnyKernel3
        path: zipper
    - name: Integrate SUSFS
      run: |
        cd source

        echo "[+] Integrating SUSFS for 4.19"
        git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.19 /tmp/susfs4ksu

        # Copy SUSFS files
        cp /tmp/susfs4ksu/kernel_patches/fs/susfs.c fs/
        cp /tmp/susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
        cp /tmp/susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/ 2>/dev/null || true

        # Apply kernel patch
        cp /tmp/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch .
        patch -p1 --fuzz=3 < 50_add_susfs_in_kernel-4.19.patch || echo "[!] Patch had conflicts, continuing..."

        # Revert SEMUA file yang conflict
        for f in $(find . -name "*.rej" 2>/dev/null); do
          target="${f%.rej}"
          git checkout -- "$target" 2>/dev/null || true
          echo "[!] Reverted: $target"
        done
        find . -name "*.rej" -delete 2>/dev/null

        # Enable SUSFS config
        echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/vendor/bengal-perf_defconfig

        rm -rf /tmp/susfs4ksu
        echo "[+] SUSFS integrated."
    - name: Integrate SukiSU-Ultra
      run: |
        cd source

        echo "[+] Append kernel params"
        echo "CONFIG_KPROBES=y" >> arch/arm64/configs/vendor/bengal-perf_defconfig
        echo "CONFIG_HAVE_KPROBES=y" >> arch/arm64/configs/vendor/bengal-perf_defconfig
        echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/vendor/bengal-perf_defconfig
        echo "CONFIG_KALLSYMS=y" >> arch/arm64/configs/vendor/bengal-perf_defconfig
        echo "CONFIG_KALLSYMS_ALL=y" >> arch/arm64/configs/vendor/bengal-perf_defconfig

        echo "[+] Integrating SukiSU-Ultra"
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin

        echo "[+] Patching for 4.19 compat"
        KSU_PATH=$(readlink -f drivers/kernelsu)

        # Fix 1: Hapus include static_call.h
        sed -i '/static_call\.h/d' "$KSU_PATH/kernel_includes.h"

        # Fix 2: linux/hex.h -> linux/kernel.h
        find "$KSU_PATH" -name "*.c" -o -name "*.h" | xargs sed -i 's|#include <linux/hex.h>|#include <linux/kernel.h>|' 2>/dev/null || true

        # Fix 3: uapi/linux/mount.h -> linux/fs.h
        find "$KSU_PATH" -name "*.c" -o -name "*.h" | xargs sed -i 's|#include <uapi/linux/mount.h>|#include <linux/fs.h>|' 2>/dev/null || true

        # Fix 4: vdso_clock_mode
        find "$KSU_PATH" -name "*.c" | xargs sed -i 's|->vdso_clock_mode|0|g' 2>/dev/null || true

        # Fix 5: access_ok 2-arg -> 3-arg
        find "$KSU_PATH" -name "*.c" | xargs sed -i 's|access_ok(\(.*\), \(.*\))|access_ok(\1, \2, VERIFY_READ)|g' 2>/dev/null || true

        # Fix 6: user_arg_null_ptr
        find "$KSU_PATH" -name "*.c" -o -name "*.h" | xargs sed -i 's|user_arg_null_ptr()|user_arg_null_ptr|g' 2>/dev/null || true

        # Fix 7: Comment out ksu_selinux_hide calls
        find "$KSU_PATH" -name "*.c" | xargs sed -i 's|ksu_selinux_hide_handle_second_stage();|/* ksu_selinux_hide_handle_second_stage(); */|g' 2>/dev/null || true
        find "$KSU_PATH" -name "*.c" | xargs sed -i 's|ksu_selinux_hide_init();|/* ksu_selinux_hide_init(); */|g' 2>/dev/null || true
        find "$KSU_PATH" -name "*.c" | xargs sed -i 's|ksu_selinux_hide_exit();|/* ksu_selinux_hide_exit(); */|g' 2>/dev/null || true

        echo "[+] Done."
    - name: Android kernel build
      uses: lemniskett/android-kernel-actions@master
      id: build
      env:
        KERNEL_PATH: source
      with:
        arch: arm64
        compiler: proton-clang/master/binutils
        defconfig: vendor/bengal-perf_defconfig
        image: Image
    - name: Upload Build
      uses: actions/upload-artifact@v4
      with:
        name: Image
        path: /home/runner/work/kernelsu-xiaomi-juice/kernelsu-xiaomi-juice/zipper   
